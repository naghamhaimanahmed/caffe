<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Resto Cafe App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: brand top bar + three working views (customer phone, manager console, reports), RTL Arabic first */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#16203A; --muted:#626C85; --line:#E2E6EE;
  --brand:#1F3B7A; --brand-ink:#1F3B7A; --on-brand:#FFFFFF; --brand-soft:#E6ECF8;
  --orange:#E8922A; --orange-soft:#FDF1E2; --price:#C8322A;
  --ok:#1E8E5E; --ok-soft:#E3F4EC; --warn:#B87406; --warn-soft:#FBF0DC; --bad:#C8322A; --bad-soft:#FBE7E5;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4;
  --phone-bezel:#10172A; --shadow:0 18px 50px -20px rgba(22,32,58,.35);
  --f-display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#161F33; --surface-2:#1B2540; --ink:#E9EDF6; --muted:#9AA4BE; --line:#28334F;
  --brand:#3A62C4; --brand-ink:#9DB6F5; --on-brand:#FFFFFF; --brand-soft:#1F2C4D;
  --orange:#F2A548; --orange-soft:#33281A; --price:#FF7A6B;
  --ok:#3FC48B; --ok-soft:#173327; --warn:#F0B44A; --warn-soft:#352A14; --bad:#FF7A6B; --bad-soft:#3A1D1D;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  --phone-bezel:#05080F; --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#161F33; --surface-2:#1B2540; --ink:#E9EDF6; --muted:#9AA4BE; --line:#28334F;
  --brand:#3A62C4; --brand-ink:#9DB6F5; --on-brand:#FFFFFF; --brand-soft:#1F2C4D;
  --orange:#F2A548; --orange-soft:#33281A; --price:#FF7A6B;
  --ok:#3FC48B; --ok-soft:#173327; --warn:#F0B44A; --warn-soft:#352A14; --bad:#FF7A6B; --bad-soft:#3A1D1D;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  --phone-bezel:#05080F; --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:44px;height:44px}
.wordmark{font-family:var(--f-display);font-size:22px;line-height:1;letter-spacing:.04em;font-style:italic;direction:ltr}
.wordmark .r{color:var(--orange)} .wordmark .c{color:var(--brand-ink)}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-inline-start:auto;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;white-space:nowrap;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.seg svg{width:16px;height:16px}

.view{max-width:1440px;margin:0 auto;padding-block:24px 48px}

/* ---------- customer stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:32px;align-items:start}
.notes{display:grid;gap:14px;align-content:start;padding-top:20px;min-width:0}
.notes h2{font-family:var(--f-display);font-size:26px;font-weight:400;color:var(--brand-ink)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.note b{display:block;margin-bottom:2px}
.note p{margin:0;color:var(--muted);font-size:13px}
.note .k{display:inline-block;font-size:11px;letter-spacing:.06em;color:var(--orange);font-weight:600;margin-bottom:4px}
@media (max-width:1180px){.stage{grid-template-columns:1fr}.notes{order:2;padding-top:0;max-width:640px;margin:0 auto;width:100%}}

/* ---------- phone ---------- */
.phone{width:390px;max-width:100%;height:812px;background:var(--phone-bezel);border-radius:52px;padding:12px;box-shadow:var(--shadow);position:relative;margin:0 auto}
.phone-screen{background:var(--bg);border-radius:40px;height:100%;overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;direction:ltr}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:var(--phone-bezel);border-radius:20px;z-index:5}
.sbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 96px;scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
@media (max-width:480px){
  .phone{width:100%;height:calc(100dvh - 140px);min-height:600px;border-radius:28px;padding:6px}
  .phone-screen{border-radius:24px}.notch{display:none}.statusbar{height:20px}
}
.tabbar{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 22px;z-index:4}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative;padding:4px 0}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--brand-ink);font-weight:600}
.badge{position:absolute;top:0;inset-inline-start:calc(50% + 6px);background:var(--orange);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}

.apphead{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.apphead .mark{width:40px;height:40px;flex:none}
.apphead h1{font-size:18px;font-weight:600}
.apphead .sp{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn .badge{top:-5px;inset-inline-start:auto;inset-inline-end:-5px}
.backrow{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.backrow h1{font-size:18px;font-weight:600;flex:1}
.backrow .iconbtn svg{transform:scaleX(-1)}

.banner{background:var(--orange-soft);border:1px solid color-mix(in srgb,var(--orange) 35%,transparent);color:var(--ink);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-bottom:12px}
.banner svg{width:18px;height:18px;color:var(--orange);flex:none;margin-top:2px}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.banner.bad svg{color:var(--bad)}

.crowd{background:var(--brand);color:var(--on-brand);border-radius:20px;padding:16px;display:grid;gap:10px;margin-bottom:14px;position:relative;overflow:hidden}
.crowd .lbl{font-size:12px;opacity:.8}
.crowd .lvl{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.meter i{height:6px;border-radius:4px;background:rgba(255,255,255,.22)}
.meter i.on{background:var(--orange)}
.crowd .facts{display:flex;gap:16px;font-size:12px;opacity:.92}
.crowd .facts b{font-size:15px;display:block}
.crowd::after{content:"";position:absolute;inset-inline-start:-40px;top:-40px;width:150px;height:150px;border:18px solid rgba(255,255,255,.06);border-radius:50%}

.active-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;margin-bottom:16px;text-align:start;width:100%}
.active-card .top{display:flex;justify-content:space-between;align-items:center}
.ordno{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--brand-ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps i{height:5px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--ok)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 10px}
.sec-h h2{font-size:16px;font-weight:600}
.link{border:0;background:none;color:var(--brand-ink);font-weight:500;font-size:13px;padding:0}

.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 8px;display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:500;text-align:center}
.cat .thumb{width:44px;height:44px}

.thumb{border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--cc) 14%,var(--surface));color:var(--cc)}
.thumb svg{width:58%;height:58%}

.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:0 -18px;padding-inline:18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pop{flex:none;width:136px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:6px;text-align:start}
.pop .thumb{width:100%;height:84px}
.pop .nm{font-weight:600;font-size:13px;line-height:1.3}
.pop .row{display:flex;justify-content:space-between;align-items:center}

.price{color:var(--price);font-weight:700}
.addbtn{width:32px;height:32px;border-radius:10px;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.addbtn svg{width:18px;height:18px}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{border:0;background:transparent;flex:1;min-width:0;height:100%;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.stickybar{position:sticky;top:-4px;background:var(--bg);z-index:2;padding-top:4px;margin:0 -18px;padding-inline:18px}

.mgroup h3{font-size:14px;margin:14px 0 8px;color:var(--muted);font-weight:600}
.mitem{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;width:100%;text-align:start}
.mitem .thumb{width:56px;height:56px}
.mitem .info{flex:1;min-width:0}
.mitem .nm{font-weight:600;font-size:14px;line-height:1.3}
.mitem .en{font-size:11px;color:var(--muted);direction:ltr;text-align:right}
.mitem.out{background:var(--surface-2)}
.mitem.out .thumb,.mitem.out .nm,.mitem.out .price{filter:grayscale(1);opacity:.55}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand-ink)}
.notify{border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:11px;padding:5px 8px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.notify svg{width:14px;height:14px}
.notify[aria-pressed="true"]{border-color:var(--brand-ink);color:var(--brand-ink);background:var(--brand-soft)}
.fav{border:0;background:none;color:var(--muted);padding:4px;display:grid}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:var(--price)}
.fav[aria-pressed="true"] svg{fill:currentColor}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(8,12,24,.45);z-index:8;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:26px 26px 0 0;max-height:88%;overflow-y:auto;padding:10px 18px 24px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet,.toast{animation:none}}
.grab{width:40px;height:5px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet .hero{height:150px;width:100%;border-radius:20px}
.sheet h2{font-size:20px;margin-top:12px}
.opt{margin-top:14px}
.opt .t{font-weight:600;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.opt .chips{flex-wrap:wrap;padding:0}
textarea.in,input.in,select.in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;outline:none}
textarea.in{min-height:64px;resize:vertical}
.stepper{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:3px}
.stepper button{width:30px;height:30px;border:0;border-radius:9px;background:var(--surface-2);display:grid;place-items:center}
.stepper button svg{width:16px;height:16px}
.stepper span{min-width:22px;text-align:center;font-weight:600}
.cta{width:100%;border:0;background:var(--brand);color:var(--on-brand);border-radius:16px;height:52px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px}
.cta:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.cta.center{justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost-bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .thumb{width:46px;height:46px}
.line .info{flex:1;min-width:0}
.line .meta{font-size:12px;color:var(--muted)}
.line.unav .info .nm{text-decoration:line-through;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.sumrow.total{font-weight:700;font-size:16px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.choice{display:grid;gap:8px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;text-align:start;width:100%}
.choice button svg{width:20px;height:20px;color:var(--brand-ink);flex:none}
.choice button[aria-pressed="true"]{border-color:var(--brand-ink);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-ink)}
.choice button .s{display:block;font-size:12px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:grid;justify-items:center;font-size:13px;font-weight:600}
.slots button small{font-weight:400;font-size:10px;color:var(--muted)}
.slots button[aria-pressed="true"]{border-color:var(--brand-ink);background:var(--brand-soft);color:var(--brand-ink)}
.slots button:disabled{opacity:.45;cursor:not-allowed}
.slots button:disabled small{color:var(--bad)}
.field-h{font-weight:600;margin:16px 0 8px;font-size:14px}

.track-hero{text-align:center;display:grid;gap:4px;justify-items:center;padding:8px 0 16px}
.track-hero .ordno{font-size:56px}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink);margin-bottom:6px}
.ring svg{width:40px;height:40px}
.ring.ready{background:var(--ok-soft);color:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--ok) 15%,transparent)}}
@media (prefers-reduced-motion:reduce){.ring.ready{animation:none}}
.timeline{display:grid;gap:0;margin:8px 0}
.tl{display:grid;grid-template-columns:28px 1fr;gap:10px;position:relative;padding-bottom:16px}
.tl:last-child{padding-bottom:0}
.tl .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1}
.tl .dot svg{width:14px;height:14px}
.tl.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl.now .dot{border-color:var(--orange);color:var(--orange)}
.tl:not(:last-child)::before{content:"";position:absolute;inset-inline-start:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl.done:not(:last-child)::before{background:var(--ok)}
.tl b{display:block;font-size:14px}
.tl span{font-size:12px;color:var(--muted)}
.code{font-family:var(--f-display);font-size:30px;letter-spacing:.3em;color:var(--brand-ink);direction:ltr}

.points{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 70%,var(--orange)));color:var(--on-brand);border-radius:20px;padding:16px;display:grid;gap:8px}
.points .big{font-family:var(--f-display);font-size:36px;line-height:1}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:4px}
.menu-list button{width:100%;display:flex;align-items:center;gap:12px;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
.menu-list button:last-child{border-bottom:0}
.menu-list svg{width:20px;height:20px;color:var(--brand-ink)}
.menu-list .sp{flex:1}
.empty{text-align:center;padding:40px 10px;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty svg{width:48px;height:48px;color:var(--line)}

.toast{position:absolute;top:52px;left:12px;right:12px;z-index:9;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:down .25s ease-out;font-size:13px}
.toast svg{width:22px;height:22px;color:var(--orange);flex:none}
@keyframes down{from{transform:translateY(-16px);opacity:0}}

/* ---------- manager ---------- */
.mgr{display:grid;grid-template-columns:210px minmax(0,1fr) auto;gap:20px;align-items:start}
.side{display:grid;gap:4px;position:sticky;top:90px}
.side button{border:0;background:none;text-align:start;padding:10px 12px;border-radius:12px;display:flex;align-items:center;gap:10px;font-weight:500;color:var(--muted)}
.side button svg{width:18px;height:18px}
.side button[aria-current="true"]{background:var(--surface);color:var(--brand-ink);box-shadow:inset 0 0 0 1px var(--line)}
.side .cnt{margin-inline-start:auto;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
.side .who{margin-top:16px;padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.side .who b{display:block;color:var(--ink);font-size:13px}
.mgr-phone{position:sticky;top:90px;display:grid;gap:8px;justify-items:center}

/* seeded rng */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(20261014);
const pick = (arr,w)=>{let s=0;const tot=w.reduce((a,b)=>a+b,0);let x=R()*tot;for(let i=0;i<arr.length;i++){s+=w[i];if(x<s)return arr[i]}return arr[arr.length-1]};

const DAY = 864e5;
const HIST = [];
(function genHistory(){
  for(let d=60; d>=0; d--){
    const date = new Date(TODAY0 - d*DAY);
    const wd = date.getDay(); // 5 = Friday
    const f = wd===5 ? .3 : wd===6 ? .75 : 1;
    const total = Math.round((130 + R()*70) * f * (1 + (60-d)*0.003));
    for(let i=0;i<total;i++){
      const h = pick(HOURS,HW);
      if(d===0 && h > NOW.getHours()) continue;
      if(d===0 && h === NOW.getHours() && R() > NOW.getMinutes()/60) continue;
      const n = pick([1,2,3],[55,33,12]);
      const items=[];let t=0;
      for(let k=0;k<n;k++){const it=pick(MENU,POPW);const q=R()<.1?2:1;items.push([it.id,q]);t+=it.price*q}
      const peak = (h===9||h===13||h===14);
      HIST.push({d, h, wd, items, total:t, pay:pick(['cash','vf','insta','card'],[55,20,15,10]), prep: Math.round(3 + R()*5 + (peak?4:0))});
    }
  }
})();

function reportData(){
  const r=U.range;const nowH=NOW.getHours();
  let cur,prev,label;
  if(r==='today'){cur=o=>o.d===0;prev=o=>o.d===1&&o.h<=nowH;label='مقارنة بنفس الوقت امبارح'}
  else{const n=+r;cur=o=>o.d>=0&&o.d<n;prev=o=>o.d>=n&&o.d<2*n;label=`مقارنة بالـ${n} يوم اللي قبلهم`}
  const live=S.orders.filter(o=>!o.past&&o.status!=='cancelled'&&o.createdAt>=TODAY0).map(o=>({d:0,h:new Date(o.createdAt).getHours(),wd:new Date().getDay(),items:o.items.map(l=>[l.id,l.qty,l.price]),total:o.total,pay:o.pay,prep:S.settings.prep+3}));
  const all=HIST.concat(live);
  const C=all.filter(cur),P=all.filter(prev);
  const sum=(a,f)=>a.reduce((s,o)=>s+f(o),0);
  const k=a=>({rev:sum(a,o=>o.total),n:a.length,avg:a.length?sum(a,o=>o.total)/a.length:0,prep:a.length?sum(a,o=>o.prep)/a.length:0});
  // per product
  const prod={};MENU.forEach(m=>prod[m.id]={units:0,rev:0,punits:0});
  C.forEach(o=>o.items.forEach(([id,q,p])=>{prod[id].units+=q;prod[id].rev+=q*(p??ITEM[id].price)}));
  P.forEach(o=>o.items.forEach(([id,q])=>{prod[id].punits+=q}));
  // series
  let series;
  if(r==='today'){series=HOURS.map(h=>({k:h,label:String(h),rev:sum(C.filter(o=>o.h===h),o=>o.total),n:C.filter(o=>o.h===h).length,cur:h===nowH}))}
  else{const n=+r;series=[];for(let d=n-1;d>=0;d--){const date=new Date(TODAY0-d*DAY);const os=C.filter(o=>o.d===d);series.push({k:d,label:date.toLocaleDateString('ar-EG',{day:'numeric',month:'numeric'}),full:date.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'}),rev:sum(os,o=>o.total),n:os.length,cur:d===0})}}
  // heat: last 28 days avg orders per weekday x hour
  const wds=[6,0,1,2,3,4,5];const heat=wds.map(wd=>HOURS.map(h=>{const days=new Set(all.filter(o=>o.d>=1&&o.d<=28&&o.wd===wd).map(o=>o.d)).size||1;return all.filter(o=>o.d>=1&&o.d<=28&&o.wd===wd&&o.h===h).length/days}));
  const pay={};C.forEach(o=>pay[o.pay]=(pay[o.pay]||0)+o.total);
  return {K:k(C),PK:k(P),label,prod,series,heat,wds,pay};
}
function delta(c,p,inv=false){if(!p)return '<span class="d muted">—</span>';const d=(c-p)/p*100;const up=d>=0;const good=inv?!up:up;return `<span class="d ${good?'up':'down'}">${up?'▲':'▼'} <span class="num">${Math.abs(d).toFixed(1)}٪</span></span>`}
function barChart(series){
  const W=760,H=240,pl=8,pr=46,pt=12,pb=28;const max=Math.max(1,...series.map(s=>s.rev));
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p};
  const top=nice(max);const ticks=[0,top/4,top/2,top*3/4,top];
  const iw=W-pl-pr,ih=H-pt-pb;const bw=iw/series.length;const w=Math.min(28,Math.max(4,bw*0.62));
  const y=v=>pt+ih-(v/top)*ih;
  const every=series.length>16?Math.ceil(series.length/10):1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="الإيراد">
    ${ticks.map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${W-pr+6}" y="${y(t)+4}" text-anchor="start">${t>=1000?(t/1000)+'k':t}</text>`).join('')}
    ${series.map((s,i)=>{const cx=pl+bw*i+bw/2;const h=Math.max(0,ih-(y(s.rev)-pt));const x=cx-w/2;const yy=y(s.rev);const r=Math.min(4,w/2,h);
      // rtl: first item on the right
      const X=W-pr-(cx-pl)-w/2;
      const path=h>0?`M${X} ${pt+ih} V${yy+r} Q${X} ${yy} ${X+r} ${yy} H${X+w-r} Q${X+w} ${yy} ${X+w} ${yy+r} V${pt+ih} Z`:'';
      return `<g class="b ${s.cur?'cur':''}" tabindex="0" data-tip="${esc((s.full||('الساعة '+s.label+':00')))}|${nfmt(s.rev)} ج.م|${s.n} طلب"><rect class="hit" x="${W-pr-(cx-pl)-bw/2}" y="${pt}" width="${bw}" height="${ih}"/><path class="barm" d="${path}"/>${i%every===0?`<text x="${X+w/2}" y="${H-8}" text-anchor="middle">${s.label}</text>`:''}</g>`}).join('')}
  </svg>`;
}

function openItem(id){U.sheet=id;const it=ITEM[id];const firstV=it.variants.find(v=>S.variants[id][v.id]);U.sel={variant:it.variants.length?(firstV?.id||null):null,sugar:hasSugar(it)?'mazboot':null,note:'',qty:1};}
function addToCart(id,{variant=null,sugar=null,note='',qty=1}={}){
  const ex=S.cart.find(l=>l.id===id&&l.variant===variant&&l.sugar===sugar&&l.note===note);
  if(ex)ex.qty+=qty;else S.cart.push({id,variant,sugar,note,qty});
}
function placeOrder(){
  const c=U.checkout;const lines=S.cart.filter(lineOK);if(!lines.length)return;
  const sub=lines.reduce((a,l)=>a+priceOf(l.id)*l.qty,0);const disc=c.usePoints?Math.min(Math.floor(S.points/100)*10,sub):0;
  const o={no:S.nextNo++,by:ME,name:'أنت',items:lines.map(l=>({...l,price:priceOf(l.id)})),total:sub-disc,status:'new',createdAt:Date.now(),pickup:c.slot,type:c.type,table:c.table,pay:c.pay,code:String(1000+Math.floor(Math.random()*9000))};
  S.orders.push(o);
  if(disc)S.points-=disc*10;S.points+=Math.floor(o.total/10);
  lines.forEach(l=>{const s=S.items[l.id];if(s.stock!==null){s.stock=Math.max(0,s.stock-l.qty);if(s.stock===0){s.available=false;S.log.unshift({t:Date.now(),id:l.id,on:false,auto:true})}}});
  S.cart=[];U.checkout={type:'pickup',table:'',slot:'asap',pay:'cash',usePoints:false};
  notify(`طلبك رقم ${o.no} وصل للكافيتريا`);U.trackNo=o.no;U.screen='track';
}
function simulate(){
  const names=['مريم','زياد','هنا','علي','فرح','مازن','رنا','حسن'];
  for(let i=0;i<4;i++){const n=1+Math.floor(Math.random()*3);const items=[];
    for(let k=0;k<n;k++){const av=MENU.filter(m=>isAvail(m.id));const it=av[Math.floor(Math.random()*av.length)];const v=it.variants.find(v=>S.variants[it.id][v.id]);items.push({id:it.id,qty:1,variant:v?v.id:null,sugar:hasSugar(it)?'mazboot':null,note:'',price:priceOf(it.id)});
      const s=S.items[it.id];if(s.stock!==null){s.stock=Math.max(0,s.stock-1);if(s.stock===0){s.available=false;S.log.unshift({t:Date.now(),id:it.id,on:false,auto:true})}}}
    S.orders.push({no:S.nextNo++,by:'other',name:names[Math.floor(Math.random()*names.length)],items,total:items.reduce((a,b)=>a+b.price,0),status:'new',createdAt:Date.now()-Math.floor(Math.random()*3)*60e3,pickup:'asap',type:Math.random()<.3?'table':'pickup',table:String(1+Math.floor(Math.random()*12)),pay:['cash','vf','insta','card'][Math.floor(Math.random()*4)],code:String(1000+Math.floor(Math.random()*9000))});}
}

const root=document.getElementById('root');
root.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){return}
  if(t.dataset.act==='closesheet'&&e.target.closest('[data-stop]'))return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'view':U.view=t.dataset.v;try{localStorage.setItem(KEY+'-view',U.view)}catch(_){}render();window.scrollTo(0,0);return;
    case 'go':U.screen=t.dataset.s;U.sheet=null;if(U.screen==='notifs'){renderPhone();save();return}break;
    case 'cat':U.cat=t.dataset.c;U.screen='menu';break;
    case 'open':openItem(id);break;
    case 'closesheet':U.sheet=null;break;
    case 'quick':{const it=ITEM[id];if(it.variants.length||hasSugar(it)){openItem(id)}else{addToCart(id);toast(`اتضاف ${it.ar} للسلة`,'bag')}break}
    case 'selvar':U.sel.variant=t.dataset.v;break;
    case 'selsugar':U.sel.sugar=t.dataset.v;break;
    case 'selqty':U.sel.qty=Math.max(1,U.sel.qty+ +t.dataset.d);break;
    case 'addsel':{const it=ITEM[U.sheet];addToCart(U.sheet,U.sel);U.sheet=null;toast(`اتضاف ${it.ar} للسلة`,'bag');break}
    case 'fav':S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];break;
    case 'notifyme':if(!S.notifyMe.includes(id)){S.notifyMe.push(id);toast(`هنبلغك أول ما ${ITEM[id].ar} يرجع`,'bell')}break;
    case 'cq':{const l=S.cart[+t.dataset.i];l.qty+= +t.dataset.d;if(l.qty<=0)S.cart.splice(+t.dataset.i,1);break}
    case 'rm':S.cart.splice(+t.dataset.i,1);break;
    case 'clearcart':S.cart=[];break;
    case 'ctype':U.checkout.type=t.dataset.v;break;
    case 'cslot':U.checkout.slot=t.dataset.v;break;
    case 'cpay':U.checkout.pay=t.dataset.v;break;
    case 'usepts':U.checkout.usePoints=t.checked;break;
    case 'place':placeOrder();break;
    case 'track':U.trackNo=+t.dataset.no;U.screen='track';break;
    case 'reorder':{const o=S.orders.find(x=>x.no===+t.dataset.no);let skipped=0;o.items.forEach(l=>{if(isAvail(l.id)&&varAvail(l.id,l.variant))addToCart(l.id,{variant:l.variant,sugar:l.sugar,note:l.note,qty:l.qty});else skipped++});U.screen='cart';if(skipped)setTimeout(()=>toast(`${skipped} صنف من الطلب ده خلص ومتضافش`,'alert'),30);break}
    case 'cancelmine':{const o=S.orders.find(x=>x.no===+t.dataset.no);if(o&&o.status==='new')o.status='cancelled';break}
    case 'mtab':U.mtab=t.dataset.v;U.confirmReset=false;break;
    case 'adv':{const o=S.orders.find(x=>x.no===+t.dataset.no);o.status=t.dataset.to;
      if(o.by===ME){const msg={preparing:`طلبك #${o.no} بيتحضر دلوقتي`,ready:`طلبك #${o.no} جاهز! استلمه بالكود ${o.code}`,done:`بالهنا والشفا، اتستلم طلب #${o.no}`,cancelled:`طلب #${o.no} اتلغى من الكافيتريا`}[o.to||t.dataset.to];notify(msg);setTimeout(()=>toast(msg,t.dataset.to==='ready'?'bell':'receipt'),30)}break}
    case 'sim':simulate();break;
    case 'pause':S.settings.paused=!S.settings.paused;break;
    case 'tog':{const s=S.items[id];const on=!(s.available&&(s.stock===null||s.stock>0));setAvail(id,on);break}
    case 'vtog':setAvail(id,!S.variants[id][t.dataset.v],{variant:t.dataset.v});break;
    case 'catall':{const on=t.dataset.on==='true';MENU.filter(m=>m.cat===t.dataset.c).forEach(m=>{if(S.items[m.id].available!==on)setAvail(m.id,on)});break}
    case 'pcat':U.pcat=t.dataset.c;break;
    case 'reset':if(!U.confirmReset){U.confirmReset=true;renderMgr();return}S=freshState();U.confirmReset=false;U.screen='home';U.sheet=null;break;
    case 'range':U.range=t.dataset.v;break;
    case 'tcat':U.tcat=t.dataset.c;break;
    case 'sort':{const k=t.dataset.k;if(U.sort===k)U.sortDir*=-1;else{U.sort=k;U.sortDir=k==='name'?1:-1}break}
    case 'csv':{const txt=csv();const done=()=>{t.innerHTML=ic('check')+'اتنسخ، الصقه في إكسل'};
      try{navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done))}catch(_){fallback(txt,done)}return}
    default:return;
  }
  commit();
});
function fallback(txt,done){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(_){}ta.remove()}

root.addEventListener('input',e=>{
  const t=e.target;const k=t.dataset.inp;if(!k)return;
  if(k==='q'){U.q=t.value;renderPhone();return}
  if(k==='note'){U.sel.note=t.value;return}
  if(k==='table'){U.checkout.table=t.value;renderPhone();return}
  if(k==='pq'){U.pq=t.value;renderMgr();return}
  if(k==='set'){const key=t.dataset.k;S.settings[key]=key==='banner'?t.value:Math.max(1,+t.value||1);save();renderPhone();return}
});
root.addEventListener('change',e=>{
  const t=e.target;const k=t.dataset.inp;
  if(k==='price'){S.items[t.dataset.id].price=Math.max(0,+t.value||0);commit()}
  if(k==='stock'){const id=t.dataset.id;const v=t.value.trim();const s=S.items[id];const was=isAvail(id);
    s.stock=v===''?null:Math.max(0,Math.floor(+v));
    if(s.stock===0&&s.available){s.available=false;S.log.unshift({t:Date.now(),id,on:false,auto:true})}
    else if(s.stock>0&&!s.available&&!was){setAvail(id,true)}
    commit()}
});
// chart tooltip
const tip=document.getElementById('tip');
function showTip(el,x,y){const [a,b,c]=el.dataset.tip.split('|');tip.innerHTML=`<b>${esc(b)}</b><span>${esc(a)}</span><span>${esc(c)}</span>`;tip.hidden=false;const r=tip.getBoundingClientRect();tip.style.left=Math.min(innerWidth-r.width-8,Math.max(8,x-r.width/2))+'px';tip.style.top=Math.max(8,y-r.height-12)+'px'}
root.addEventListener('pointermove',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
root.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}});
root.addEventListener('focusout',()=>tip.hidden=true);
root.addEventListener('pointerleave',()=>tip.hidden=true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.sheet){U.sheet=null;renderPhone()}});
// live sync between browser tabs (e.g. manager on one screen, customer on another)
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const prev=S;S=JSON.parse(e.newValue);
  const mine=prev.orders.filter(o=>o.by===ME);mine.forEach(o=>{const n=S.orders.find(x=>x.no===o.no);if(n&&n.status!==o.status&&n.status==='ready')toast(`طلبك #${n.no} جاهز! استلمه بالكود ${n.code}`,'bell')});render()}catch(_){}}});
setInterval(()=>{if(U.view==='manager'&&U.mtab==='orders'&&!root.querySelector('#mgrMain :focus'))renderMgr()},30000);

document.querySelectorAll('[data-logo]').forEach(el=>el.innerHTML=LOGO);
document.querySelectorAll('[data-ic]').forEach(el=>el.outerHTML=ic(el.dataset.ic));
renderNotes();
render();
})();
</script>
